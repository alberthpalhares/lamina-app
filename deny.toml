# Política de dependências (ADR 0008). Rode: cargo deny check
[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # `ttf-parser` sem manutenção (não é falha de segurança). Chega pelo winit (decorações de
    # janela no Wayland), dentro do Slint; sai quando o Slint atualizar o winit (ADR 0002).
    { id = "RUSTSEC-2026-0192", reason = "transitivo do Slint/winit; revisar a cada versão do Slint" },
    # `zbus_names`, `zvariant` e `zvariant_derive` viraram módulos do `zbus` 6 (não é falha de
    # segurança). Chegam pela acessibilidade do Slint no Linux (accesskit/atspi) e pelo rfd; saem
    # quando eles passarem para o `zbus` 6 (ADR 0002).
    { id = "RUSTSEC-2026-0370", reason = "transitivo do Slint/rfd; revisar a cada versão do Slint" },
    { id = "RUSTSEC-2026-0371", reason = "transitivo do Slint/rfd; revisar a cada versão do Slint" },
    { id = "RUSTSEC-2026-0372", reason = "transitivo do Slint/rfd; revisar a cada versão do Slint" },
    # `zip` 8.6, preso pelo Velopack (spec DS, decisão 2 do dono; ADR 0009). Os três alertas são
    # de `ZipArchive::extract` (bits SUID e links simbólicos); o Velopack não usa essa função:
    # grava arquivo por arquivo com `by_index`, sem permissões nem links, e confere o SHA de cada
    # pacote. Saem quando o Velopack passar para o `zip` 9.
    { id = "RUSTSEC-2026-0367", reason = "transitivo do Velopack; função afetada não é usada; revisar a cada versão do Velopack" },
    { id = "RUSTSEC-2026-0368", reason = "transitivo do Velopack; função afetada não é usada; revisar a cada versão do Velopack" },
    { id = "RUSTSEC-2026-0369", reason = "transitivo do Velopack; função afetada não é usada; revisar a cada versão do Velopack" },
    # `derivative` sem manutenção (não é falha de segurança): macro de compilação do Velopack.
    { id = "RUSTSEC-2024-0388", reason = "macro de compilação do Velopack; revisar a cada versão do Velopack" },
    # `pin-utils` sem manutenção (não é falha de segurança; o repositório foi arquivado). Chega
    # pelo `spin_on` do Slint; sai quando o Slint trocar.
    { id = "RUSTSEC-2026-0441", reason = "transitivo do Slint/spin_on; revisar a cada versão do Slint" },
]

[licenses]
# O código do próprio Lamina usa a PolyForm Strict (LICENSE), que não é permissiva: ignora as
# crates privadas (não publicadas) e continua exigindo permissivas só nas dependências.
private = { ignore = true }
# Permissivas apenas. GPL/LGPL ficam de fora porque o Rust liga estaticamente.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost: permissiva como a MIT (dependência do Slint para a área de transferência).
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

# Slint (ADR 0002): usamos a licença Royalty-free 2.0, que pede a atribuição "Feito com Slint" na
# tela Sobre. A GPL da licença tripla não é a escolhida.
[[licenses.exceptions]]
crate = "i-slint-backend-linuxkms"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-selector"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-testing"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-winit"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-common"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-compiler"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-core"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-core-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-femtovg"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-skia"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-software"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint-build"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# A lista de certificados raiz da Mozilla, que o HTTPS da atualização automática usa (o `ureq`
# do Velopack). Licença de dados permissiva, fora da lista geral: exceção nomeada (spec DS,
# decisão 1 do dono; ADR 0009).
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]
