[package]
name = "lamina-editor"
description = "Lógica do aplicativo do Lamina, sem janela: sessão, comandos, visão da lâmina e navegador de fotos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
lamina-core = { workspace = true }
lamina-media = { workspace = true }
lamina-layout = { workspace = true }
lamina-render = { workspace = true }
lamina-export = { workspace = true }
chrono = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

# O movimento do sistema no Windows (spec AJ, ADR 0016); a API usada não precisa de `unsafe`.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[lints]
workspace = true
