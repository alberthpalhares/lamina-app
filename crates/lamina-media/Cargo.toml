[package]
name = "lamina-media"
description = "Importação de fotos: formatos, metadados EXIF, miniaturas e catálogo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
lamina-core = { workspace = true }
kamadak-exif = { workspace = true }
image = { workspace = true }
# Converter as fotos com perfil próprio (spec CT; ADR 0007).
moxcms = { workspace = true }
# Reduzir as cópias de tela e as miniaturas (spec TR, regra 3; o mesmo redutor do ADR 0006).
fast_image_resize = { workspace = true }
# Ler o JPEG já reduzido nas cópias de tela e miniaturas (spec LV, regra 9). A leitura para a
# impressão continua no `image`, inteira.
jpeg-decoder = { workspace = true }
rusqlite = { workspace = true }
blake3 = { workspace = true }
rayon = { workspace = true }
# Gravar as miniaturas e as imagens de tela de uma vez, sem nunca aparecerem pela metade.
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
dhat = { workspace = true }

[lints]
workspace = true
