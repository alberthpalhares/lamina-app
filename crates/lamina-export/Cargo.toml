[package]
name = "lamina-export"
description = "Exportação para impressão: JPEG, TIFF, PDF, perfis ICC e pré-impressão."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# O código da prova da aprovação do cliente (spec AC, regra 20).
blake3 = { workspace = true }
serde_json = { workspace = true }
# As imagens dentro do HTML da aprovação do cliente (spec AH).
base64 = { workspace = true }
lamina-core = { workspace = true }
lamina-render = { workspace = true }
image = { workspace = true }
moxcms = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
# Temporário de nome único para a gravação segura (spec EX, regra 6).
tempfile = { workspace = true }
# PDF/X-4 de impressão (spec PD).
pdf-writer = { workspace = true }
# TIFF sem perda, com perfil de cor (spec CT).
tiff = { workspace = true }

[dev-dependencies]
dhat = { workspace = true }
lopdf = { workspace = true }

[lints]
workspace = true
