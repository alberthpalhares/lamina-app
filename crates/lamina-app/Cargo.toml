[package]
name = "lamina-app"
description = "Interface gráfica do Lamina, em Slint (ADR 0002)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# A filmagem da interface (spec FI): nunca entra no instalador.
filmagem = []

[dependencies]
lamina-core = { workspace = true }
lamina-editor = { workspace = true }
lamina-layout = { workspace = true }
anyhow = { workspace = true }
# `unstable-winit-030`: o evento da janela que recebe arquivos soltos de outro programa (spec IM,
# regra 10; ADR 0011, decisão 9). Conferir a cada versão nova do Slint (ADR 0002, adendo).
slint = { workspace = true, features = ["unstable-winit-030"] }
rfd = { workspace = true }
velopack = { workspace = true }

# O evento "abrir documentos" do Mac (duplo clique no .lamina; spec MA, ADR 0013).
[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = { workspace = true }

[dev-dependencies]
image = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

# Os lints do workspace, com uma diferença: `unsafe_code` é `deny` (e não `forbid`) para o módulo
# `ui`, gerado pelo Slint, poder liberar o `unsafe` dele. O nosso código continua sem `unsafe`
# (AGENTS.md, regra 3; ADR 0002).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
panic = "warn"
unreachable = "warn"
unimplemented = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
