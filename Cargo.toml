[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0-beta.8.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/alberthpalhares/lamina-app"
authors = ["Equipe Lâmina"]

# Versões centralizadas: cada crate declara `dep = { workspace = true }`.
[workspace.dependencies]
lamina-core = { path = "crates/lamina-core" }
lamina-media = { path = "crates/lamina-media" }
lamina-layout = { path = "crates/lamina-layout" }
lamina-render = { path = "crates/lamina-render" }
lamina-export = { path = "crates/lamina-export" }
lamina-editor = { path = "crates/lamina-editor" }
lamina-mcp = { path = "crates/lamina-mcp" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: ler de volta exatamente os números gravados (projeto salvo = projeto aberto).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1"
rayon = "1"
# Renderização (ADR 0006): tela de desenho e redução das fotos com Lanczos3.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
fast_image_resize = "6"
jpeg-decoder = { version = "0.3", default-features = false }
# Texto (spec TX; ADR 0006, adendo): linhas com o `parley` e contorno das letras com o `skrifa`,
# as mesmas versões que o Slint já usa. A feature `system` lê as fontes do computador (spec FS);
# o Slint já compila os mesmos pacotes, e nenhum entra de novo no Cargo.lock.
parley = { version = "0.11", default-features = false, features = ["std", "system"] }
skrifa = "0.44"
# Perfil de cor sRGB embutido nos JPEGs de impressão (ADR 0007).
moxcms = "0.8"
tempfile = "3"
# Pico de memória nos testes da importação (spec TR, TR-B1); só como dependência de testes.
dhat = "0.3"
# Instalador e atualização automática (ADR 0009). Versão presa: o spike provou esta.
velopack = "=1.2.161"
# Os arquivos abertos pelo Finder no Mac (spec MA; ADR 0013), presa na versão lida linha a linha.
fmv-macos-events = "=0.1.0"
# Esquema JSON do formato do projeto, gerado dos tipos (spec EI, regra 9).
schemars = "1"
# PDF de impressão (spec PD; ADR 0007, plano B) e a leitura dele nos testes.
pdf-writer = "0.15"
lopdf = "0.45"
# TIFF de impressão sem perda (spec CT); a mesma versão que o `image` usa.
tiff = "0.11"
# Interface (ADR 0002) e diálogos de arquivo do sistema (spec JP).
slint = "1.18"
slint-build = "1.18"
# Ícone e nome no executável do Windows (só ao compilar, só no Windows). Versão fixa de março de
# 2026: as seguintes saíram há menos de duas semanas.
winresource = "=0.1.31"
rfd = "0.17"
# Controle por IA (spec IA; ADR 0010): o SDK oficial do MCP e o runtime dele, só no `lamina-mcp`.
# Versão presa: a mais nova com mais de duas semanas em 2026-10-19.
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std", "macros", "sync"] }
# As imagens vão em base64 nas respostas do MCP (a mesma versão que o resto do lock já usa).
base64 = "0.23"
# Hora local da tela inicial ("hoje, 14:32"; spec TI): a mesma versão que o resto do lock já usa.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Lints pedagógicos: ajudam iniciantes a evitar armadilhas comuns.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
# Regra 3: biblioteca devolve erro, não entra em pânico (auditoria do Marco 1, M11).
panic = "warn"
unreachable = "warn"
unimplemented = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.dev]
# Espaço em disco: o nosso código guarda só arquivo e linha (o backtrace e os erros continuam
# apontando o lugar), sem as tabelas completas de variáveis que enchiam o `target`.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependências otimizadas mesmo em debug: decodificar imagens sem otimização é muito lento.
opt-level = 2
# E sem informação de depuração: ninguém depura por dentro do slint ou do image, e era a maior
# parte do `target\debug\deps`.
debug = false

[profile.dev.package.lamina-media]
# Teste de velocidade da importação (spec TR, TR-B6) mede código otimizado.
opt-level = 3

[profile.dev.package.lamina-export]
# Teste de velocidade da exportação (spec EX, EX-B12) mede código otimizado.
opt-level = 3

[profile.dev.package.lamina-render]
# Mesma razão do lamina-layout: o teste de velocidade (spec RD, RD-B12) mede código otimizado.
opt-level = 3

[profile.dev.package.lamina-layout]
# O gerador de layouts responde à interface; o teste de velocidade (spec VL, VL-B9) mede o
# código otimizado também em `cargo test`.
opt-level = 3

[profile.dev.package.lamina-editor]
# Teste de velocidade da janela (spec JP, JP-B13) mede código otimizado.
opt-level = 3

[profile.dist]
# O programa que vai para o fotógrafo (release.yml): otimização entre todos os crates de uma vez,
# para um executável menor e mais rápido. Compila bem mais devagar, por isso o `--release` do dia
# a dia (conferir a janela, o `lamina mcp` local) continua no perfil `release`.
inherits = "release"
lto = "fat"
codegen-units = 1
